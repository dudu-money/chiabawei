/* 青綠底加燕麥米色的低彩度單色系，俐落現代字體。要換顏色只需改下面這些變數 */

<body>
<main class="wrap">
  <header>
    <h1>呷飽未</h1>
    <p class="lede">民以食為天，與其天天煩惱，不如來找找</p>
    <div class="row" id="now" style="margin-top:12px"></div>
  </header>

  <section class="banner" id="joinBanner" hidden></section>
  <section class="panel" id="authPanel" hidden aria-label="登入或註冊"></section>

  <div class="tabs" role="tablist" aria-label="清單">
    <button class="tab" role="tab" id="tabRec" aria-selected="true" type="button">推薦店家</button>
    <button class="tab" role="tab" id="tabMine" aria-selected="false" type="button">我的清單</button>
  </div>

  <section class="row" style="flex-direction:column;align-items:stretch" aria-label="篩選">
    <input class="search" id="q" type="search" placeholder="搜尋店名，區域，或想吃的東西，例如 蛋餅，牛肉麵，旗津" autocomplete="off">
    <div class="chips" id="chips" role="group" aria-label="餐別"></div>
    <div class="row">
      <select class="select" id="city" aria-label="縣市" hidden></select>
      <select class="select" id="district" aria-label="行政區"></select>
      <span class="spacer"></span>
      <button class="btn" id="addToggle" type="button" aria-expanded="false" aria-controls="addPanel" hidden>新增店家</button>
      <button class="btn primary" id="pickBtn" type="button">幫我選一家</button>
    </div>
  </section>

  <section class="pick" id="pick" hidden aria-live="polite"></section>

  <section class="panel" id="addPanel" hidden>
    <form id="addForm" autocomplete="off">
      <label class="f">店名
        <input class="input" type="text" id="fName" maxlength="40" required>
      </label>
      <label class="f">縣市
        <input class="input" type="text" id="fCity" list="cityList" maxlength="8" placeholder="例如 台南市">
        <datalist id="cityList"></datalist>
      </label>
      <label class="f">行政區（選填）
        <input class="input" type="text" id="fDistrict" list="districtList" maxlength="10" placeholder="例如 安平區">
        <datalist id="districtList"></datalist>
      </label>
      <label class="f">地址或位置（選填）
        <input class="input" type="text" id="fAddr" maxlength="80">
      </label>
      <fieldset class="cats full" id="fCats"><legend>分類（可複選）</legend></fieldset>
      <label class="f full">備註，想點什麼（選填）
        <input class="input" type="text" id="fNote" maxlength="80">
      </label>
      <div class="full row">
        <button class="btn primary" type="submit">加入清單</button>
        <p class="msg" id="addMsg" role="status"></p>
      </div>
    </form>
  </section>

  <p class="count" id="count"></p>
  <ul class="grid" id="list"></ul>

  <footer>
    <p>推薦店家目前收錄高雄，整理自食尚玩家，美人圈等公開介紹。其他縣市的店可以自己加進「我的清單」。營業時間，價格與公休日可能變動，出門前請在 Google 地圖確認。</p>
    <p id="modeNote"></p>
  </footer>
</main>
<div class="toast" id="toast" role="status" hidden></div>

function lastCity() { try { return localStorage.getItem(LS_CITY) || "高雄市"; } catch (e) { return "高雄市"; } }

const state = {
  tab: "rec", cat: "全部", city: "全部", district: "全部", q: "", lastPick: null,
  user: null, lists: [], listId: null, cloudPlaces: [], localPlaces: loadLocal(),
  pendingJoin: new URLSearchParams(location.search).get("join"), creating: false
};
let fb = null;           // 連上 Firebase 之後才有值
let unsubLists = null, unsubPlaces = null;

const $ = (id) => document.getElementById(id);
function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  if (attrs) for (const k of Object.keys(attrs)) {
    if (k === "text") node.textContent = attrs[k];
    else if (k === "class") node.className = attrs[k];
    else node.setAttribute(k, attrs[k]);
  }
  for (const c of kids) if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  return node;
}
function loadLocal() {
  try { const a = JSON.parse(localStorage.getItem(LS_LOCAL) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}
function saveLocal() { try { localStorage.setItem(LS_LOCAL, JSON.stringify(state.localPlaces)); return true; } catch (e) { return false; } }
let toastTimer = null;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
}

const cloudOn = () => !!(fb && state.user && state.listId);
const minePlaces = () => cloudOn() ? state.cloudPlaces : state.localPlaces;
const currentList = () => state.lists.find((l) => l.id === state.listId) || null;

function mapUrl(s) {
  const q = (s.city ? s.city + " " : "") + s.n + (s.a ? " " + s.a : "");
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}
function matches(s) {
  if (state.cat !== "全部" && s.c.indexOf(state.cat) < 0) return false;
  if (state.city !== "全部" && (s.city || "") !== state.city) return false;
  if (state.district !== "全部" && s.d !== state.district) return false;
  if (state.q) {
    const hay = (s.n + " " + (s.city || "") + " " + (s.d || "") + " " + (s.a || "") + " " + (s.t || "") + " " + s.c.join(" ")).toLowerCase();
    const parts = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    for (const p of parts) if (hay.indexOf(p) < 0) return false;
  }
  return true;
}
const currentRows = () => (state.tab === "rec" ? BASE : minePlaces()).filter(matches);

/* ---------- 顯示 ---------- */
function card(s, isMine) {
  const tags = el("div", { class: "tags" });
  s.c.forEach((c) => tags.appendChild(el("span", { class: "tag", text: c })));
  const meta = el("p", { class: "meta" });
  let place = (s.city || "") + (s.d || "");
  if (s.a) {
    if (s.d && s.a.indexOf(s.d) === 0) place = (s.city || "") + s.a;
    else place += (place ? "，" : "") + s.a;
  }
  if (place) meta.appendChild(el("span", { text: place }));
  if (s.h) meta.appendChild(el("span", null, el("strong", { text: "營業 " }), s.h));
  if (s.tel) meta.appendChild(el("span", null, el("strong", { text: "電話 " }), s.tel));
  if (isMine && s.by) meta.appendChild(el("span", { text: "由 " + s.by + " 加入" }));

  const acts = el("div", { class: "acts" });
  acts.appendChild(el("a", { class: "btn small link", href: mapUrl(s), target: "_blank", rel: "noopener noreferrer", text: "開 Google 地圖" }));
  if (isMine) {
    const del = el("button", { class: "btn small", type: "button", text: "刪除" });
    let armed = false, timer = null;
    del.addEventListener("click", async () => {
      if (!armed) {
        armed = true; del.textContent = "再按一次確定刪除";
        timer = setTimeout(() => { armed = false; del.textContent = "刪除"; }, 3000);
        return;
      }
      clearTimeout(timer);
      await removePlace(s.id);
    });
    acts.appendChild(del);
  } else {
    const add = el("button", { class: "btn small primary", type: "button", text: "加入我的清單" });
    add.addEventListener("click", () => addFromBase(s));
    acts.appendChild(add);
  }
  const li = el("li", { class: "card" }, el("h3", { text: s.n }), tags, meta);
  if (s.t) li.appendChild(el("p", { class: "note", text: s.t }));
  li.appendChild(acts);
  return li;
}

function renderList() {
  const list = $("list"); list.textContent = "";
  const rows = currentRows();
  rows.forEach((s) => list.appendChild(card(s, state.tab === "mine")));
  $("count").textContent = "顯示 " + rows.length + " 家";
  if (!rows.length) {
    let msg = "沒有符合的店家，換個分類或搜尋字詞看看。";
    if (state.tab === "mine" && !minePlaces().length) msg = "清單還是空的。到「推薦店家」按「加入我的清單」，或按「新增店家」輸入自己知道的店。";
    list.appendChild(el("li", { class: "empty", text: msg }));
  }
}
function renderChips() {
  const box = $("chips"); box.textContent = "";
  ["全部"].concat(CATS).forEach((c) => {
    const b = el("button", { class: "chip", type: "button", "aria-pressed": String(state.cat === c), text: c });
    b.addEventListener("click", () => { state.cat = c; renderAll(); });
    box.appendChild(b);
  });
}
function renderCities() {
  const all = BASE.concat(minePlaces());
  const set = {};
  all.forEach((s) => { if (s.city) set[s.city] = true; });
  const names = Object.keys(set);
  if (state.city !== "全部" && !set[state.city]) state.city = "全部";
  const sel = $("city");
  sel.hidden = names.length < 2;
  sel.textContent = "";
  ["全部"].concat(names).forEach((c) => {
    const o = el("option", { value: c, text: c === "全部" ? "所有縣市" : c });
    if (c === state.city) o.selected = true;
    sel.appendChild(o);
  });
  const dl = $("cityList"); dl.textContent = "";
  TW_CITIES.forEach((c) => dl.appendChild(el("option", { value: c })));
}
function renderDistricts() {
  const set = {};
  const all = BASE.concat(minePlaces());
  all.forEach((s) => { if (s.d && (state.city === "全部" || (s.city || "") === state.city)) set[s.d] = true; });
  const names = Object.keys(set);
  if (state.district !== "全部" && !set[state.district]) state.district = "全部";
  const sel = $("district"); sel.textContent = "";
  ["全部"].concat(names).forEach((d) => {
    const o = el("option", { value: d, text: d === "全部" ? "所有行政區" : d });
    if (d === state.district) o.selected = true;
    sel.appendChild(o);
  });
  const dl = $("districtList"); dl.textContent = "";
  const seen = {};
  all.forEach((s) => { if (s.d && !seen[s.d]) { seen[s.d] = true; dl.appendChild(el("option", { value: s.d })); } });
}
function renderTabs() {
  const rec = state.tab === "rec";
  $("tabRec").setAttribute("aria-selected", String(rec));
  $("tabMine").setAttribute("aria-selected", String(!rec));
  $("tabMine").textContent = "我的清單（" + minePlaces().length + "）";
  $("addToggle").hidden = rec;
  if (rec) { $("addPanel").hidden = true; $("addToggle").setAttribute("aria-expanded", "false"); }
}
function renderNow() {
  const d = new Date();
  const h = d.getHours();
  const slot = h >= 5 && h < 10 ? "早餐" : h >= 10 && h < 14 ? "午餐" : h >= 14 && h < 17 ? "下午茶" : h >= 17 && h < 21 ? "晚餐" : "小吃";
  const word = slot === "小吃" ? "宵夜小吃" : slot;
  const box = $("now"); box.textContent = "";
  box.appendChild(el("span", { text: "現在 " + ("0" + h).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) + "，適合吃" + word }));
  const b = el("button", { class: "btn small", type: "button", text: "只看" + word });
  b.addEventListener("click", () => { state.cat = slot; renderAll(); });
  box.appendChild(b);
}

function renderAll() { renderAcct(); renderTabs(); renderChips(); renderCities(); renderDistricts(); renderList(); }

/* ---------- 隨機挑選 ---------- */
function pickOne() {
  const rows = currentRows();
  const box = $("pick"); box.textContent = ""; box.hidden = false;
  if (!rows.length) { box.appendChild(el("p", { class: "muted", style: "margin:0", text: "目前的篩選下沒有店家可以抽，先放寬分類或行政區。" })); return; }
  let s = rows[Math.floor(Math.random() * rows.length)];
  if (rows.length > 1 && state.lastPick === s.n) s = rows[(rows.indexOf(s) + 1) % rows.length];
  state.lastPick = s.n;
  const scope = (state.cat === "全部" ? "全部分類" : state.cat) + (state.city === "全部" ? "" : "，" + state.city) + (state.district === "全部" ? "" : "，" + state.district);
  box.appendChild(el("span", { class: "muted", text: "從 " + rows.length + " 家（" + scope + "）裡抽到" }));
  box.appendChild(el("h2", { text: s.n }));
  const info = [];
  const where = (s.city || "") + (s.d || "");
  if (where) info.push(where);
  if (s.h) info.push("營業 " + s.h);
  if (info.length) box.appendChild(el("span", { class: "muted", text: info.join("，") }));
  if (s.t) box.appendChild(el("p", { class: "note", text: s.t }));
  const acts = el("div", { class: "acts" });
  acts.appendChild(el("a", { class: "btn primary", href: mapUrl(s), target: "_blank", rel: "noopener noreferrer", text: "開 Google 地圖" }));
  const again = el("button", { class: "btn", type: "button", text: "再抽一次" });
  again.addEventListener("click", pickOne);
  const close = el("button", { class: "btn", type: "button", text: "關閉" });
  close.addEventListener("click", () => { box.hidden = true; });
  acts.appendChild(again); acts.appendChild(close);
  box.appendChild(acts);
}

/* ---------- 店家新增與刪除 ---------- */
function myName() { return state.user ? (state.user.displayName || (state.user.email || "").split("@")[0]) : ""; }

async function addPlace(p) {
  if (minePlaces().some((x) => x.n === p.n && (x.city || "") === (p.city || ""))) { toast("「" + p.n + "」已經在清單裡了"); return false; }
  if (cloudOn()) {
    try {
      await fb.F.addDoc(fb.F.collection(fb.db, "lists", state.listId, "places"), {
        n: p.n, c: p.c, city: p.city || "", d: p.d || "", a: p.a || "", t: p.t || "", h: p.h || "", tel: p.tel || "",
        addedBy: state.user.uid, addedByName: myName(), createdAtMs: Date.now()
      });
      return true;
    } catch (e) { toast("沒辦法儲存，請檢查網路或登入狀態"); return false; }
  }
  state.localPlaces.unshift({ id: "l" + Date.now() + Math.floor(Math.random() * 1000), n: p.n, c: p.c, city: p.city || "", d: p.d || "", a: p.a || "", t: p.t || "", h: p.h || "", tel: p.tel || "" });
  if (!saveLocal()) toast("這個瀏覽器無法儲存，重新整理後會消失");
  renderAll();
  return true;
}
async function addFromBase(s) {
  const ok = await addPlace(s);
  if (ok) toast("已加入「" + s.n + "」");
}
async function removePlace(id) {
  if (cloudOn()) {
    try { await fb.F.deleteDoc(fb.F.doc(fb.db, "lists", state.listId, "places", id)); }
    catch (e) { toast("刪除失敗，請稍後再試"); }
    return;
  }
  state.localPlaces = state.localPlaces.filter((x) => x.id !== id);
  saveLocal(); renderAll();
}

const catBox = $("fCats");
CATS.forEach((c, i) => catBox.appendChild(el("label", { class: "check" }, el("input", { type: "checkbox", id: "fc" + i, value: c }), c)));

});

const AUTH_ERR = {
  "auth/invalid-email": "Email 格式不對。",
  "auth/missing-password": "請輸入密碼。",
  "auth/weak-password": "密碼至少要 6 個字。",
  "auth/email-already-in-use": "這個 Email 已經註冊過，請改按「登入」。",
  "auth/invalid-credential": "Email 或密碼不對。",
  "auth/wrong-password": "Email 或密碼不對。",
  "auth/user-not-found": "找不到這個帳號，請先註冊。",
  "auth/too-many-requests": "試太多次了，請稍後再試。",
  "auth/network-request-failed": "網路連不上，請檢查連線。",
  "auth/operation-not-allowed": "這個專案還沒啟用 Email 登入，請照說明到 Firebase 打開。"
};
function showAuth(show) {
  const p = $("authPanel");
  p.hidden = !show;
  if (!show) return;
  p.textContent = "";
  const form = el("form", { class: "grid2", autocomplete: "on" });
  form.appendChild(el("label", { class: "f" }, "Email", el("input", { class: "input", id: "aEmail", type: "email", autocomplete: "email", required: "" })));
  form.appendChild(el("label", { class: "f" }, "密碼（至少 6 個字）", el("input", { class: "input", id: "aPass", type: "password", autocomplete: "current-password", required: "" })));
  form.appendChild(el("label", { class: "f full" }, "你的名稱（註冊時用，家人會看到）", el("input", { class: "input", id: "aName", type: "text", maxlength: "12", placeholder: "例如 小美" })));
  const row = el("div", { class: "full row" });
  const signin = el("button", { class: "btn primary", type: "submit", text: "登入" });
  const signup = el("button", { class: "btn", type: "button", text: "註冊新帳號" });
  const cancel = el("button", { class: "btn", type: "button", text: "取消" });
  const msg = el("p", { class: "msg", id: "aMsg", role: "status" });
  row.appendChild(signin); row.appendChild(signup); row.appendChild(cancel);
  form.appendChild(row); form.appendChild(el("div", { class: "full" }, msg));
  const run = async (fn) => {
    msg.textContent = "處理中⋯⋯";
    try { await fn(); showAuth(false); }
    catch (e) { msg.textContent = AUTH_ERR[e && e.code] || "操作失敗，請稍後再試。"; }
  };
  form.addEventListener("submit", (e) => { e.preventDefault(); run(() => fb.A.signInWithEmailAndPassword(fb.auth, $("aEmail").value.trim(), $("aPass").value)); });
  signup.addEventListener("click", () => run(async () => {
    const cred = await fb.A.createUserWithEmailAndPassword(fb.auth, $("aEmail").value.trim(), $("aPass").value);
    const nm = $("aName").value.trim();
    if (nm) { await fb.A.updateProfile(cred.user, { displayName: nm }); state.user = fb.auth.currentUser; renderAll(); }
  }));
  cancel.addEventListener("click", () => showAuth(false));
  p.appendChild(form);
  $("aEmail").focus();
}

/* ---------- 雲端清單 ---------- */
function setList(id) {
  state.listId = id;
  try { localStorage.setItem(LS_LIST, id); } catch (e) {}
  subscribePlaces();
  renderAll();
}
function subscribeLists() {
  if (unsubLists) unsubLists();
  const q = fb.F.query(fb.F.collection(fb.db, "lists"), fb.F.where("members", "array-contains", state.user.uid));
  unsubLists = fb.F.onSnapshot(q, (snap) => {
    state.lists = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAtMs || 0) - (b.createdAtMs || 0));
    let want = state.listId;
    if (!want) { try { want = localStorage.getItem(LS_LIST); } catch (e) {} }
    if (!state.lists.some((l) => l.id === want)) want = state.lists.length ? state.lists[0].id : null;
    const changed = want !== state.listId || !unsubPlaces;
    state.listId = want;
    if (changed) subscribePlaces();
    if (!state.lists.length && !state.creating && !state.pendingJoin) createList("我的清單", true);
    renderAll();
  }, () => toast("讀不到清單，請確認 Firestore 規則已發布"));
}
function subscribePlaces() {
  if (unsubPlaces) { unsubPlaces(); unsubPlaces = null; }
  state.cloudPlaces = [];
  if (!state.listId) return;
  unsubPlaces = fb.F.onSnapshot(fb.F.collection(fb.db, "lists", state.listId, "places"), (snap) => {
    state.cloudPlaces = snap.docs.map((d) => {
      const x = d.data();
      return { id: d.id, n: x.n, c: x.c || [], city: x.city || "", d: x.d, a: x.a, t: x.t, h: x.h, tel: x.tel, by: x.addedByName, at: x.createdAtMs || 0 };
    }).sort((a, b) => b.at - a.at);
    renderAll();
  }, () => toast("讀不到店家，請確認 Firestore 規則已發布"));
}
async function createList(name, withLocal) {
  state.creating = true;
  try {
    const ref = await fb.F.addDoc(fb.F.collection(fb.db, "lists"), {
      name, ownerUid: state.user.uid, members: [state.user.uid], createdAtMs: Date.now()
    });
    if (withLocal && state.localPlaces.length) {
      const batch = fb.F.writeBatch(fb.db);
      state.localPlaces.forEach((p) => {
        batch.set(fb.F.doc(fb.F.collection(fb.db, "lists", ref.id, "places")), {
          n: p.n, c: p.c, city: p.city || "", d: p.d || "", a: p.a || "", t: p.t || "", h: p.h || "", tel: p.tel || "",
          addedBy: state.user.uid, addedByName: myName(), createdAtMs: Date.now()
        });
      });
      await batch.commit();
      toast("已把這支手機原本的 " + state.localPlaces.length + " 家店搬進雲端清單");
    }
    setList(ref.id);
  } catch (e) { toast("建立清單失敗，請確認 Firestore 規則已發布"); }
  state.creating = false;
}
async function shareList() {
  const l = currentList();
  if (!l) return;
  const url = location.origin + location.pathname + "?join=" + l.id;
  const box = $("shareBox"); box.textContent = ""; box.hidden = false;
  const input = el("input", { class: "input", type: "text", readonly: "", value: url, "aria-label": "邀請連結" });
  const copy = el("button", { class: "btn small primary", type: "button", text: "複製連結" });
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(url); toast("已複製，貼給家人朋友就行"); }
    catch (e) { input.focus(); input.select(); toast("請長按選取後複製"); }
  });
  box.appendChild(el("p", { class: "muted", style: "margin:0 0 6px", text: "拿到連結的人登入後就會加入「" + l.name + "」，請只傳給信任的人。" }));
  box.appendChild(el("div", { class: "row" }, input, copy));
}
async function doJoin(id) {
  try {
    const ref = fb.F.doc(fb.db, "lists", id);
    const snap = await fb.F.getDoc(ref);
    if (!snap.exists()) { toast("找不到這份清單，連結可能不完整"); return; }
    const d = snap.data();
    if (!d.members.includes(state.user.uid)) await fb.F.updateDoc(ref, { members: fb.F.arrayUnion(state.user.uid) });
    state.listId = id;
    try { localStorage.setItem(LS_LIST, id); } catch (e) {}
    state.tab = "mine";
    toast("已加入「" + d.name + "」");
  } catch (e) { toast("加入失敗，請確認已登入再試一次"); }
  state.pendingJoin = null;
  history.replaceState(null, "", location.pathname);
  $("joinBanner").hidden = true;
}

async function onAuth(user) {
  state.user = user;
  if (unsubLists) { unsubLists(); unsubLists = null; }
  if (unsubPlaces) { unsubPlaces(); unsubPlaces = null; }
  state.lists = []; state.cloudPlaces = []; state.listId = null;
  if (user) {
    showAuth(false);
    if (state.pendingJoin) await doJoin(state.pendingJoin);
    subscribeLists();
  } else if (state.pendingJoin) {
    const b = $("joinBanner"); b.hidden = false;
    b.textContent = "有人邀請你加入一份共用清單。請先登入或註冊，登入後會自動加入。";
    showAuth(true);
  }
  renderAll();
}

async function initFirebase() {
  if (!firebaseConfig || !firebaseConfig.apiKey) return;
  try {
    const base = "https://www.gstatic.com/firebasejs/" + FB_VER + "/";
    const [appM, authM, fsM] = await Promise.all([
      import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")
    ]);
    const app = appM.initializeApp(firebaseConfig);
    fb = { auth: authM.getAuth(app), db: fsM.getFirestore(app), A: authM, F: fsM };
    authM.onAuthStateChanged(fb.auth, onAuth);
  } catch (e) {
    fb = null;
    toast("共用功能連不上，先用單機模式");
  }
  renderAll();
}

/* ---------- 啟動 ---------- */
$("fCity").value = lastCity();
renderNow();
renderAll();
initFirebase();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
